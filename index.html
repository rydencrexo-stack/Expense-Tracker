<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #7b8497;
      --border: #e7eaf0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 12px 35px rgba(20, 32, 56, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 1180px;
      margin: auto;
      padding: 28px 20px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand h1 { font-size: 30px; }
    .brand p { color: var(--muted); margin-top: 5px; }

    .date-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .summary-card .value {
      font-size: 28px;
      font-weight: 800;
    }

    .income { color: var(--green); }
    .expense { color: var(--red); }
    .balance { color: var(--primary); }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .form-card { padding: 24px; }
    .transactions-card { padding: 24px; }

    .card h2 {
      font-size: 19px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
    }

    .amount-wrap { position: relative; }
    .amount-wrap span {
      position: absolute;
      left: 13px;
      top: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .amount-wrap input { padding-left: 30px; }

    .add-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .add-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .toolbar h2 { margin: 0; }

    .filters {
      display: flex;
      gap: 8px;
    }

    .filters select { width: auto; min-width: 130px; }

    .empty {
      text-align: center;
      padding: 55px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .transaction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .transaction:last-child { border-bottom: 0; }

    .transaction-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .category-icon {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      background: #eef4ff;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .transaction-info { min-width: 0; }
    .transaction-title {
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transaction-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .transaction-right {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
    }

    .transaction-amount {
      font-weight: 800;
      color: var(--red);
    }

    .delete-btn {
      border: 0;
      background: #fff1f2;
      color: var(--red);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
    }

    .delete-btn:hover { background: #ffe4e6; }

    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--red);
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }

    .category-breakdown {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .category-breakdown h3 {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .bar-row { margin-bottom: 11px; }
    .bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .bar-info span:last-child { color: var(--muted); }

    .bar {
      height: 7px;
      background: #eef1f5;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: inherit;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .app { padding: 20px 14px 40px; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .filters { width: 100%; }
      .filters select { flex: 1; width: 100%; }
      .transaction-right { gap: 8px; }
      .transaction-amount { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>Expense Tracker</h1>
        <p>Track your spending and stay in control.</p>
      </div>
      <div class="date-badge" id="today"></div>
    </header>

    <section class="summary">
      <div class="summary-card">
        <div class="label">Total Income</div>
        <div class="value income" id="incomeTotal">₹0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Total Expenses</div>
        <div class="value expense" id="expenseTotal">₹0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Balance</div>
        <div class="value balance" id="balanceTotal">₹0.00</div>
      </div>
    </section>

    <div class="layout">
      <section class="card form-card">
        <h2>Add Expense</h2>

        <form id="expenseForm">
          <div class="field">
            <label for="title">Expense Name</label>
            <input id="title" type="text" placeholder="e.g. Lunch" required>
          </div>

          <div class="field">
            <label for="amount">Amount</label>
            <div class="amount-wrap">
              <span>₹</span>
              <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
            </div>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option>Food</option>
              <option>Transport</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Health</option>
              <option>Education</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>

          <button class="add-btn" type="submit">+ Add Expense</button>
        </form>

        <div class="category-breakdown">
          <h3>Spending by Category</h3>
          <div id="breakdown"></div>
        </div>
      </section>

      <section class="card transactions-card">
        <div class="toolbar">
          <h2>Recent Expenses</h2>
          <div class="filters">
            <select id="filterCategory">
              <option value="All">All Categories</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Health</option>
              <option>Education</option>
              <option>Other</option>
            </select>
            <button class="clear-btn" id="clearAll" type="button">Clear All</button>
          </div>
        </div>

        <div id="transactions"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "expenseTrackerData";

    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const form = document.getElementById("expenseForm");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const filterCategory = document.getElementById("filterCategory");

    const categoryIcons = {
      Food: "🍔",
      Transport: "🚗",
      Shopping: "🛍️",
      Bills: "🧾",
      Entertainment: "🎬",
      Health: "❤️",
      Education: "📚",
      Other: "📌"
    };

    function todayString() {
      const d = new Date();
      const offset = d.getTimezoneOffset();
      return new Date(d.getTime() - offset * 60000).toISOString().split("T")[0];
    }

    dateInput.value = todayString();

    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-IN", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function money(value) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2
      }).format(value);
    }

    function formatDate(date) {
      return new Date(date + "T00:00:00").toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function renderSummary() {
      const expenseTotal = expenses.reduce((sum, item) => sum + item.amount, 0);

      document.getElementById("incomeTotal").textContent = money(0);
      document.getElementById("expenseTotal").textContent = money(expenseTotal);
      document.getElementById("balanceTotal").textContent = money(-expenseTotal);
    }

    function renderTransactions() {
      const container = document.getElementById("transactions");
      const selected = filterCategory.value;

      let filtered = selected === "All"
        ? [...expenses]
        : expenses.filter(item => item.category === selected);

      filtered.sort((a, b) => {
        return new Date(b.date) - new Date(a.date) || b.id - a.id;
      });

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">💸</div>
            <strong>No expenses yet</strong>
            <p>Add your first expense using the form.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="transaction">
          <div class="transaction-left">
            <div class="category-icon">${categoryIcons[item.category]}</div>
            <div class="transaction-info">
              <div class="transaction-title">${escapeHTML(item.title)}</div>
              <div class="transaction-meta">
                ${item.category} · ${formatDate(item.date)}
              </div>
            </div>
          </div>

          <div class="transaction-right">
            <div class="transaction-amount">-${money(item.amount)}</div>
            <button class="delete-btn" onclick="deleteExpense(${item.id})" title="Delete">
              🗑
            </button>
          </div>
        </div>
      `).join("");
    }

    function renderBreakdown() {
      const container = document.getElementById("breakdown");
      const totals = {};

      expenses.forEach(item => {
        totals[item.category] = (totals[item.category] || 0) + item.amount;
      });

      const total = Object.values(totals).reduce((a, b) => a + b, 0);

      if (!total) {
        container.innerHTML = `<p style="font-size:12px;color:var(--muted)">No spending data yet.</p>`;
        return;
      }

      container.innerHTML = Object.entries(totals)
        .sort((a, b) => b[1] - a[1])
        .map(([category, value]) => {
          const percentage = (value / total) * 100;
          return `
            <div class="bar-row">
              <div class="bar-info">
                <span>${category}</span>
                <span>${money(value)}</span>
              </div>
              <div class="bar">
                <div class="bar-fill" style="width:${percentage}%"></div>
              </div>
            </div>
          `;
        }).join("");
    }

    function render() {
      renderSummary();
      renderTransactions();
      renderBreakdown();
    }

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      save();
      render();
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const amount = Number(amountInput.value);

      if (!title || !amount || amount <= 0) return;

      expenses.push({
        id: Date.now(),
        title,
        amount,
        category: categoryInput.value,
        date: dateInput.value
      });

      save();
      render();

      form.reset();
      dateInput.value = todayString();
      categoryInput.value = "Food";
      titleInput.focus();
    });

    filterCategory.addEventListener("change", renderTransactions);

    document.getElementById("clearAll").addEventListener("click", () => {
      if (!expenses.length) return;

      if (confirm("Delete all expenses? This cannot be undone.")) {
        expenses = [];
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
